name: Feature Request
description: Suggest an idea or enhancement for Aselkim (Dictionary, Academy, Games, or Platform).
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation.

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Detailed explanation of how this feature should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
